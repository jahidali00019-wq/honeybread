name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: |
          unzip honeybread-fabric-1.21.1-source.zip
          cd honeybread
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: honeybread-mod
          path: honeybread/build/libs/*.jar
